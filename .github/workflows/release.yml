name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
        type: string
      refresh_existing:
        description: 'Replace an existing release only after explicit approval'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  verify-and-package:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          $tag = "v$version"
          $existing = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0 -and $existing -ne (git rev-parse HEAD) -and $env:REFRESH_EXISTING -ne 'true') { throw 'Release tag points to a different commit.' }
          $global:LASTEXITCODE = 0
      - name: Restore and test WinUI solution
        shell: pwsh
        run: |
          dotnet restore ClipboardManager.sln --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet test ClipboardManager.sln -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Solution tests failed.' }
      - name: Build WinUI App
        shell: pwsh
        run: |
          dotnet build src/ClipboardManager.App/ClipboardManager.App.csproj -c Release -p:Platform=x64 --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WinUI x64 Release build failed.' }
      - name: Check packaging contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/packaging/Test-Package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package contract failed.' }
          pwsh -NoProfile -File tests/packaging/Test-LegacyUpgrade.ps1
          if ($LASTEXITCODE -ne 0) { throw 'First-upgrade policy contract failed.' }
      - name: Build WinUI package and update manifest
        shell: pwsh
        run: ./package.ps1 -Version '${{ steps.version.outputs.value }}' -OutputDirectory ./dist
      - name: Validate built package
        shell: pwsh
        run: pwsh -NoProfile -File tests/packaging/Test-Package.ps1 -PackageDirectory ./dist -PackageVersion '${{ steps.version.outputs.value }}'
      - name: Download ProcDump for isolated startup diagnostics
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'procdump'
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'procdump.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory -Force
          $tool = Join-Path $toolDirectory 'procdump64.exe'
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw 'ProcDump x64 executable is missing.' }
          "PROCDUMP_PATH=$tool" >> $env:GITHUB_ENV
      - name: Verify portable launch, synthetic update, and data retention
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: pwsh -NoProfile -File tests/packaging/Test-PortablePackage.ps1 -Archive 'dist/ClipboardManager-${{ steps.version.outputs.value }}-win-x64.zip' -Version '${{ steps.version.outputs.value }}'
      - name: Analyze WinUI startup crash dump
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $dump = Join-Path $env:RUNNER_TEMP 'ClipboardManager.App-crash.dmp'
          if (-not (Test-Path -LiteralPath $dump)) { Write-Host 'No local crash dump was produced.'; exit 0 }
          winget install --id Microsoft.WinDbg --exact --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw 'WinDbg installation failed.' }
          $debugger = Get-Command WinDbgX.exe -ErrorAction Stop
          $log = Join-Path $env:RUNNER_TEMP 'ClipboardManager.App-crash-analysis.txt'
          $start = [Diagnostics.ProcessStartInfo]::new($debugger.Source)
          $start.UseShellExecute = $false
          foreach ($argument in @('-z', $dump, '-logo', $log, '-c', '.loadby sos coreclr; !threads; !pe; !clrstack -a; .exr -1; dpp @$exr_param0 L1; dt combase!STOWED_EXCEPTION_INFORMATION_V2 poi(@$exr_param0) -r; q')) { $start.ArgumentList.Add($argument) }
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(240000)) {
            $process.Kill($true)
            [void]$process.WaitForExit(15000)
            Write-Host 'WinDbg analysis timed out; preserving the partial log.'
          }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 250 }
      - name: Upload WinUI startup crash analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-startup-crash-analysis
          path: |
            ${{ runner.temp }}/ClipboardManager.App-crash-analysis.txt
            ${{ runner.temp }}/ClipboardManager.App-crash.dmp
          if-no-files-found: ignore
          retention-days: 3
      - name: Build and verify per-user installer
        shell: pwsh
        run: ./installer.ps1 -Archive 'dist/ClipboardManager-${{ steps.version.outputs.value }}-win-x64.zip' -Version '${{ steps.version.outputs.value }}' -OutputDirectory ./dist -VerifyInstall
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: clipboardmanager-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [secret-scan, verify-and-package]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: clipboardmanager-release-assets
          path: dist
      - name: Publish verified assets with the repository token
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-and-package.outputs.version }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: ./publish-release.ps1 -Version $env:VERSION -Directory ./dist -RefreshExisting:($env:REFRESH_EXISTING -eq 'true')

