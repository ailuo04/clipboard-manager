name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.0.2'
        required: true
        type: string
      refresh_existing:
        description: 'Replace an existing release only after explicit approval'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          $tag = "v$version"
          $existing = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0 -and $existing -ne (git rev-parse HEAD) -and $env:REFRESH_EXISTING -ne 'true') { throw 'Release tag points to a different commit.' }
          $global:LASTEXITCODE = 0
      - name: Package self-contained Windows application
        shell: pwsh
        run: ./package.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Build and verify Chinese per-user installer
        shell: pwsh
        run: ./installer.ps1 -Archive 'dist/ClipboardManager-${{ steps.version.outputs.value }}-win-x64.zip' -Version '${{ steps.version.outputs.value }}' -VerifyInstall
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-${{ steps.version.outputs.value }}-win-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: |
          ./publish-release.ps1 -Version $env:VERSION -RefreshExisting:($env:REFRESH_EXISTING -eq 'true')
